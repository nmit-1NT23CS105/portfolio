<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="resumeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" rx="24" fill="url(#resumeBg)" stroke="#1e293b" stroke-width="2"/>
  
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="520" height="700" rx="18" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="520" height="50" rx="18" fill="#1e293b"/>
    <circle cx="28" cy="25" r="5" fill="#ef4444"/>
    <circle cx="44" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="25" r="5" fill="#10b981"/>
    <text x="260" y="30" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">AI Resume ATS Analyzer</text>

    <!-- Score Circle -->
    <circle cx="260" cy="170" r="75" stroke="#1e293b" stroke-width="12" fill="none"/>
    <circle cx="260" cy="170" r="75" stroke="url(#scoreGrad)" stroke-width="12" stroke-dasharray="471" stroke-dashoffset="65" stroke-linecap="round" fill="none"/>
    <text x="260" y="165" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle">92</text>
    <text x="260" y="195" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ATS MATCH</text>

    <!-- Details -->
    <g transform="translate(40, 280)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Skill Alignment &amp; Parsing</text>
      <text x="0" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Natural Language Processing &amp; TF-IDF</text>

      <!-- Badges -->
      <g transform="translate(0, 45)">
        <rect x="0" y="0" width="90" height="28" rx="6" fill="#065f46"/>
        <text x="45" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Python ✓</text>

        <rect x="100" y="0" width="80" height="28" rx="6" fill="#065f46"/>
        <text x="140" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FastAPI ✓</text>

        <rect x="190" y="0" width="70" height="28" rx="6" fill="#065f46"/>
        <text x="225" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SQL ✓</text>

        <rect x="270" y="0" width="90" height="28" rx="6" fill="#065f46"/>
        <text x="315" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Scikit-learn ✓</text>
      </g>

      <!-- Progress bars -->
      <g transform="translate(0, 100)">
        <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Keywords Density</text>
        <rect x="0" y="10" width="440" height="12" rx="6" fill="#1e293b"/>
        <rect x="0" y="10" width="395" height="12" rx="6" fill="#06b6d4"/>

        <text x="0" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Impact Quantifiers</text>
        <rect x="0" y="60" width="440" height="12" rx="6" fill="#1e293b"/>
        <rect x="0" y="60" width="370" height="12" rx="6" fill="#10b981"/>

        <text x="0" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Format &amp; Section Hierarchy</text>
        <rect x="0" y="110" width="440" height="12" rx="6" fill="#1e293b"/>
        <rect x="0" y="110" width="420" height="12" rx="6" fill="#8b5cf6"/>
      </g>

      <!-- Live badge -->
      <rect x="0" y="260" width="440" height="55" rx="10" fill="#030712" stroke="#1f2937"/>
      <circle cx="25" cy="287" r="5" fill="#10b981"/>
      <text x="40" y="292" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12">Deployed on Render Cloud</text>
    </g>
  </g>
</svg>

