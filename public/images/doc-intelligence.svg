    <text x="44" y="372" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🔒 JWT Protected Endpoints</text>
    <text x="44" y="392" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Role-based access &amp; session tokens</text>
  </g>

  <!-- Right Main Area: Semantic Search & AI Chat Summarizer -->
  <g transform="translate(495, 260)">
    <rect x="0" y="0" width="595" height="440" rx="16" fill="#0d081d" stroke="#3b1d6e" stroke-width="1"/>
    
    <!-- Search Bar -->
    <rect x="24" y="24" width="547" height="46" rx="12" fill="#1a1236" stroke="#6d28d9" stroke-width="1"/>
    <circle cx="48" cy="47" r="7" stroke="#a78bfa" stroke-width="2"/>
    <line x1="53" y1="52" x2="60" y2="59" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <text x="72" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14">What are the SLA terms in section 4.2 of vendor contract?</text>
    <rect x="495" y="31" width="65" height="32" rx="8" fill="url(#purpleGrad)"/>
    <text x="527" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Search</text>

    <!-- Chat Messages -->
    <g transform="translate(24, 90)">
      <!-- AI Answer Card -->
      <rect x="0" y="0" width="547" height="190" rx="12" fill="#160e2e" stroke="#4c1d95" stroke-width="1"/>
      <circle cx="28" cy="30" r="14" fill="url(#purpleGrad)"/>
      <text x="28" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">AI</text>
      <text x="54" y="32" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Gemini Grounded Summary with Citations:</text>

      <text x="28" y="70" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" leading="1.5">Based on Vendor_Agreement_2025.pdf (Page 7, Section 4.2):</text>
      <text x="28" y="98" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Guaranteed uptime commitment of <tspan fill="#34d399" font-weight="700">99.95%</tspan> per billing cycle.</text>
      <text x="28" y="122" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Sev-1 critical incident response window under <tspan fill="#38bdf8" font-weight="700">15 minutes</tspan>.</text>
      <text x="28" y="146" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Monthly service credit threshold penalty applied if latency &gt; 250ms.</text>

      <!-- Source Badge -->
      <rect x="28" y="160" width="170" height="20" rx="6" fill="#2e1065"/>
      <text x="36" y="174" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="10">Source: Chunk #14 [sim: 0.942]</text>
    </g>

    <!-- Bottom Code / Test Result Strip -->
    <g transform="translate(24, 300)">
      <rect x="0" y="0" width="547" height="115" rx="10" fill="#04010a" stroke="#1f1138" stroke-width="1"/>
      <text x="20" y="28" fill="#10b981" font-family="ui-monospace, monospace" font-size="12">✓ test_jwt_auth_protected_route PASSED [0.04s]</text>
      <text x="20" y="52" fill="#10b981" font-family="ui-monospace, monospace" font-size="12">✓ test_pdf_extraction_watermark_removal PASSED [0.12s]</text>
      <text x="20" y="76" fill="#10b981" font-family="ui-monospace, monospace" font-size="12">✓ test_semantic_vector_retrieval PASSED [0.08s]</text>
      <text x="20" y="100" fill="#a855f7" font-family="ui-monospace, monospace" font-size="12">================ 37 passed in 1.48s (FastAPI TestClient) ================</text>
    </g>
  </g>
