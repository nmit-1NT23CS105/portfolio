    <circle cx="180" cy="245" r="18" fill="#8b5cf6" fill-opacity="0.2"/>
    <path d="M180 238 V252 M174 244 L180 238 L186 244" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
