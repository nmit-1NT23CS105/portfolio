<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="docBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="50%" stop-color="#140b2b"/>
      <stop offset="100%" stop-color="#07020d"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="docGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#docBgGrad)"/>

  <!-- Subtle Matrix grid -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200 M0 600 H1200 M0 700 H1200" stroke="#4c1d95" stroke-opacity="0.2" stroke-width="1"/>
  <path d="M150 0 V800 M300 0 V800 M450 0 V800 M600 0 V800 M750 0 V800 M900 0 V800 M1050 0 V800" stroke="#4c1d95" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Ambient Light -->
  <circle cx="280" cy="200" r="220" fill="#8b5cf6" fill-opacity="0.15" filter="url(#docGlow)"/>
  <circle cx="920" cy="580" r="250" fill="#ec4899" fill-opacity="0.12" filter="url(#docGlow)"/>

  <!-- Window Container -->
  <rect x="70" y="60" width="1060" height="680" rx="20" fill="#130e24" fill-opacity="0.9" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect x="70" y="60" width="1060" height="52" rx="20" fill="#1a1236" fill-opacity="0.8"/>
  <circle cx="105" cy="86" r="6" fill="#ef4444"/>
  <circle cx="125" cy="86" r="6" fill="#f59e0b"/>
  <circle cx="145" cy="86" r="6" fill="#10b981"/>
  <text x="600" y="92" fill="#c4b5fd" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" font-weight="600">ai-document-intelligence · FastAPI + Gemini LLM RAG + Semantic Search</text>

  <!-- Top Metrics Bar -->
  <g transform="translate(110, 135)">
    <rect x="0" y="0" width="220" height="100" rx="14" fill="#0d081d" stroke="#3b1d6e" stroke-width="1"/>
    <text x="24" y="34" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CATEGORIES SUPPORTED</text>
    <text x="24" y="74" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="800">8 Doc Types</text>
    <text x="135" y="74" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Auto-Classify</text>

    <rect x="250" y="0" width="220" height="100" rx="14" fill="#0d081d" stroke="#3b1d6e" stroke-width="1"/>
    <text x="274" y="34" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">API ARCHITECTURE</text>
    <text x="274" y="74" fill="#c084fc" font-family="system-ui, sans-serif" font-size="32" font-weight="800">11 Endpoints</text>
    <text x="400" y="74" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">FastAPI</text>

    <rect x="500" y="0" width="220" height="100" rx="14" fill="#0d081d" stroke="#3b1d6e" stroke-width="1"/>
    <text x="524" y="34" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TEST COVERAGE</text>
    <text x="524" y="74" fill="#34d399" font-family="system-ui, sans-serif" font-size="32" font-weight="800">37 Tests Passing</text>
    <text x="660" y="74" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">100%</text>

    <rect x="750" y="0" width="230" height="100" rx="14" fill="#0d081d" stroke="#3b1d6e" stroke-width="1"/>
    <text x="774" y="34" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">RAG ENGINE</text>
    <text x="774" y="74" fill="#f472b6" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Gemini Flash</text>
    <text x="774" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">JWT &amp; Vector Embeddings</text>
  </g>

