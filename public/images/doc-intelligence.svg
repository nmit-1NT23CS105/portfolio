      <rect x="160" y="0" width="150" height="34" rx="8" fill="#1e1b4b"/>
      <text x="176" y="22" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📝 Contract (DOCX)</text>

      <rect x="0" y="44" width="145" height="34" rx="8" fill="#1e1b4b"/>
      <text x="16" y="66" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📜 Policy Manual</text>

      <rect x="160" y="44" width="150" height="34" rx="8" fill="#1e1b4b"/>
      <text x="176" y="66" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📊 Financial Report</text>

      <rect x="0" y="88" width="145" height="34" rx="8" fill="#1e1b4b"/>
      <text x="16" y="110" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600">👤 Resume / CV</text>

      <rect x="160" y="88" width="150" height="34" rx="8" fill="#1e1b4b"/>
      <text x="176" y="110" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🔬 Research Paper</text>
