<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle Grid lines -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200 M0 600 H1200 M0 700 H1200" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>
  <path d="M150 0 V800 M300 0 V800 M450 0 V800 M600 0 V800 M750 0 V800 M900 0 V800 M1050 0 V800" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Ambient Glow -->
  <circle cx="350" cy="250" r="220" fill="#2563eb" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="850" cy="550" r="260" fill="#06b6d4" fill-opacity="0.1" filter="url(#glow)"/>

  <!-- Window Shell -->
  <rect x="70" y="60" width="1060" height="680" rx="20" fill="url(#cardGrad)" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="70" y="60" width="1060" height="52" rx="20" fill="#0f172a" fill-opacity="0.8"/>
  <circle cx="105" cy="86" r="6" fill="#ef4444"/>
  <circle cx="125" cy="86" r="6" fill="#f59e0b"/>
  <circle cx="145" cy="86" r="6" fill="#10b981"/>
  <text x="600" y="92" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" font-weight="600">churn-analytics-fastapi · Telco Supervised ML Pipeline</text>

  <!-- Top Metric Cards -->
  <g transform="translate(110, 140)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="220" height="110" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="24" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">CHURN RECALL</text>
    <text x="24" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="34" font-weight="800">83.16%</text>
    <text x="145" y="80" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">▲ +12.4%</text>

    <!-- Metric 2 -->
    <rect x="250" y="0" width="220" height="110" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="274" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">ROC-AUC SCORE</text>
    <text x="274" y="80" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="34" font-weight="800">0.8346</text>
    <text x="400" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Opt. Thresh</text>

    <!-- Metric 3 -->
    <rect x="500" y="0" width="220" height="110" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="524" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">MODEL SELECTED</text>
    <text x="524" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">GradientBoost</text>
    <text x="524" y="98" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">● Business-score weighted</text>

    <!-- Metric 4 -->
    <rect x="750" y="0" width="230" height="110" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="774" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">API LATENCY</text>
    <text x="774" y="80" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="34" font-weight="800">18ms</text>
    <text x="870" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">FastAPI Batch</text>
  </g>

  <!-- Left Chart: ROC Curve & Feature Importance -->
  <g transform="translate(110, 280)">
    <rect x="0" y="0" width="460" height="420" rx="16" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="24" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Top Predictive Feature Impact</text>
    <text x="24" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">RandomizedSearchCV + Tree Feature Importance</text>

    <!-- Bar 1 -->
    <text x="24" y="105" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13">Contract_Month-to-month</text>
    <rect x="24" y="116" width="390" height="18" rx="4" fill="#1e293b"/>
    <rect x="24" y="116" width="345" height="18" rx="4" fill="url(#accentGrad)"/>
    <text x="380" y="130" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">0.312</text>

    <!-- Bar 2 -->
    <text x="24" y="170" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13">TotalCharges / Tenure Ratio</text>
    <rect x="24" y="181" width="390" height="18" rx="4" fill="#1e293b"/>
    <rect x="24" y="181" width="280" height="18" rx="4" fill="url(#accentGrad)"/>
    <text x="315" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">0.248</text>

    <!-- Bar 3 -->
    <text x="24" y="235" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13">TechSupport_No</text>
    <rect x="24" y="246" width="390" height="18" rx="4" fill="#1e293b"/>
    <rect x="24" y="246" width="220" height="18" rx="4" fill="url(#accentGrad)"/>
    <text x="255" y="260" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">0.185</text>

    <!-- Bar 4 -->
    <text x="24" y="300" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13">OnlineSecurity_No</text>
    <rect x="24" y="311" width="390" height="18" rx="4" fill="#1e293b"/>
    <rect x="24" y="311" width="165" height="18" rx="4" fill="url(#accentGrad)"/>
    <text x="200" y="325" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">0.134</text>

    <!-- Bar 5 -->
    <text x="24" y="365" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13">MonthlyCharges</text>
    <rect x="24" y="376" width="390" height="18" rx="4" fill="#1e293b"/>
    <rect x="24" y="376" width="140" height="18" rx="4" fill="url(#accentGrad)"/>
    <text x="175" y="390" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">0.121</text>
  </g>

  <!-- Right Panel: Live Prediction & Fast API Swagger Preview -->
  <g transform="translate(600, 280)">
    <rect x="0" y="0" width="490" height="420" rx="16" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="24" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Real-Time Prediction Payload</text>
    <rect x="360" y="20" width="105" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="412" y="37" fill="#10b981" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">POST /predict</text>

    <!-- Code Block -->
    <rect x="24" y="70" width="442" height="230" rx="10" fill="#030712" stroke="#1f2937" stroke-width="1"/>
    <text x="44" y="105" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13">{"tenure": <tspan fill="#f59e0b">2</tspan>, "monthly_charges": <tspan fill="#f59e0b">89.45</tspan>,</text>
    <text x="56" y="132" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13">"contract": <tspan fill="#34d399">"Month-to-month"</tspan>,</text>
    <text x="56" y="159" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13">"internet_service": <tspan fill="#34d399">"Fiber optic"</tspan>,</text>
    <text x="56" y="186" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13">"tech_support": <tspan fill="#f87171">"No"</tspan>}</text>
    <line x1="44" y1="210" x2="446" y2="210" stroke="#1f2937" stroke-width="1"/>
    <text x="44" y="235" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">Response (threshold: 0.38):</text>
    <text x="44" y="262" fill="#ef4444" font-family="ui-monospace, monospace" font-size="14" font-weight="700">"churn_risk": "HIGH", "churn_prob": 0.842</text>
    <text x="44" y="285" fill="#10b981" font-family="ui-monospace, monospace" font-size="12">"action": "Immediate Retention Incentive Recommended"</text>

    <!-- Model Comparison Badge Matrix -->
    <g transform="translate(24, 320)">
      <rect x="0" y="0" width="100" height="70" rx="8" fill="#1e293b" fill-opacity="0.5"/>
      <text x="50" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">LogReg Baseline</text>
      <text x="50" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">76.2%</text>

      <rect x="115" y="0" width="100" height="70" rx="8" fill="#1e293b" fill-opacity="0.5"/>
      <text x="165" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Decision Tree</text>
      <text x="165" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">78.9%</text>

      <rect x="230" y="0" width="100" height="70" rx="8" fill="#1e293b" fill-opacity="0.5"/>
      <text x="280" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Random Forest</text>
      <text x="280" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">81.4%</text>

      <rect x="345" y="0" width="97" height="70" rx="8" fill="#2563eb" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
      <text x="393" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">GradientBoost ★</text>
      <text x="393" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">83.2%</text>
    </g>
  </g>
</svg>

