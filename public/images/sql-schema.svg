<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sqlBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181404"/>
      <stop offset="50%" stop-color="#2c2206"/>
      <stop offset="100%" stop-color="#0a0802"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" rx="24" fill="url(#sqlBg)" stroke="#854d0e" stroke-width="2"/>
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="520" height="700" rx="18" fill="#130e03" fill-opacity="0.9" stroke="#a16207" stroke-width="1"/>
    <rect x="0" y="0" width="520" height="50" rx="18" fill="#422006" fill-opacity="0.4"/>
    <circle cx="28" cy="25" r="5" fill="#ef4444"/>
    <circle cx="44" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="25" r="5" fill="#10b981"/>
    <text x="260" y="30" fill="#fef08a" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">MySQL Relational Normalization &amp; Indices</text>
    <g transform="translate(40, 80)">
      <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Database Schema Design</text>
      <text x="0" y="24" fill="#fde047" font-family="system-ui, sans-serif" font-size="12">3NF Normalized Structures &amp; Optimized Joins</text>
      <!-- Table schema mockup -->
      <rect x="0" y="45" width="440" height="260" rx="12" fill="#070501" stroke="#372605"/>
      <rect x="20" y="65" width="180" height="150" rx="8" fill="#1e1505" stroke="#ca8a04"/>
      <rect x="20" y="65" width="180" height="30" rx="8" fill="#a16207"/>
      <text x="30" y="85" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">tbl_customers (PK)</text>
      <text x="30" y="115" fill="#fef08a" font-family="ui-monospace, monospace" font-size="10">id: INT [AUTO_INC]</text>
      <text x="30" y="135" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">customer_id: VARCHAR</text>
      <text x="30" y="155" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">churn_risk: ENUM</text>
      <text x="30" y="175" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">created_at: TIMESTAMP</text>

      <rect x="240" y="95" width="180" height="150" rx="8" fill="#1e1505" stroke="#ca8a04"/>
      <rect x="240" y="95" width="180" height="30" rx="8" fill="#a16207"/>
      <text x="250" y="115" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">tbl_telemetry (FK)</text>
      <text x="250" y="145" fill="#fef08a" font-family="ui-monospace, monospace" font-size="10">customer_id: FK</text>
      <text x="250" y="165" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">risk_score: FLOAT</text>
      <text x="250" y="185" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">latency_ms: INT</text>
      <text x="250" y="205" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">flagged: BOOLEAN</text>

      <!-- Connection line -->
      <path d="M200 120 L240 145" stroke="#facc15" stroke-width="2"/>
    </g>
    <g transform="translate(40, 430)">
      <rect x="0" y="0" width="440" height="85" rx="10" fill="#241904" stroke="#a16207"/>
      <text x="20" y="32" fill="#fde047" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Sub-millisecond Index Scans</text>
      <text x="20" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Composite indices &amp; execution plan optimization on MySQL.</text>
    </g>
  </g>
</svg>

