<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="edaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="50%" stop-color="#0f2744"/>
      <stop offset="100%" stop-color="#030a14"/>
    </linearGradient>
    <linearGradient id="blueCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" rx="24" fill="url(#edaBg)" stroke="#1e3a8a" stroke-width="2"/>
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="520" height="700" rx="18" fill="#061224" fill-opacity="0.9" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="0" y="0" width="520" height="50" rx="18" fill="#1e3a8a" fill-opacity="0.4"/>
    <circle cx="28" cy="25" r="5" fill="#ef4444"/>
    <circle cx="44" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="25" r="5" fill="#10b981"/>
    <text x="260" y="30" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Telco EDA &amp; ROC-AUC Curve</text>
    <g transform="translate(40, 80)">
      <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">ROC-AUC 0.8346</text>
      <text x="0" y="24" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12">Threshold Optimization: 0.38</text>
      <!-- Simulated ROC Curve -->
      <rect x="0" y="45" width="440" height="260" rx="12" fill="#020817" stroke="#1e293b"/>
      <line x1="40" y1="265" x2="400" y2="265" stroke="#334155" stroke-width="1"/>
      <line x1="40" y1="65" x2="40" y2="265" stroke="#334155" stroke-width="1"/>
      <line x1="40" y1="265" x2="400" y2="65" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
      <!-- Curve line -->
      <path d="M40 265 C60 110, 160 80, 400 65" fill="none" stroke="url(#blueCyan)" stroke-width="4"/>
      <circle cx="160" cy="98" r="6" fill="#38bdf8"/>
      <text x="175" y="98" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Optimum (Recall: 83.2%)</text>
      <text x="40" y="290" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">False Positive Rate</text>
      <text x="340" y="290" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">True Positive Rate</text>
    </g>
    <g transform="translate(40, 430)">
      <rect x="0" y="0" width="440" height="85" rx="10" fill="#0b1a30" stroke="#1e3a8a"/>
      <text x="20" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Business Impact Matrix</text>
      <text x="20" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">High-risk customer retention recall prioritized over raw accuracy.</text>
    </g>
  </g>
</svg>

