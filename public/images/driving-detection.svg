<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="driveBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#02060c"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="driveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#driveBg)"/>

  <!-- Subtle Radar grid lines -->
  <circle cx="600" cy="400" r="380" stroke="#0ea5e9" stroke-opacity="0.1" stroke-width="1" fill="none"/>
  <circle cx="600" cy="400" r="260" stroke="#0ea5e9" stroke-opacity="0.12" stroke-width="1" fill="none"/>
  <circle cx="600" cy="400" r="140" stroke="#0ea5e9" stroke-opacity="0.15" stroke-width="1" fill="none"/>
  <line x1="600" y1="0" x2="600" y2="800" stroke="#0ea5e9" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#0ea5e9" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Ambient Glow -->
  <circle cx="280" cy="320" r="200" fill="#0284c7" fill-opacity="0.15" filter="url(#driveGlow)"/>
  <circle cx="920" cy="480" r="220" fill="#ef4444" fill-opacity="0.12" filter="url(#driveGlow)"/>

  <!-- Window Container -->
  <rect x="70" y="60" width="1060" height="680" rx="20" fill="#081426" fill-opacity="0.9" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="70" y="60" width="1060" height="52" rx="20" fill="#0c1e38" fill-opacity="0.8"/>
  <circle cx="105" cy="86" r="6" fill="#ef4444"/>
  <circle cx="125" cy="86" r="6" fill="#f59e0b"/>
  <circle cx="145" cy="86" r="6" fill="#10b981"/>
  <text x="600" y="92" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" font-weight="600">dual-stream-driver-safety · In-Cabin MediaPipe + Road YOLOv8 Telemetry</text>

  <!-- Status Bar -->
  <g transform="translate(110, 135)">
    <rect x="0" y="0" width="220" height="90" rx="14" fill="#040c18" stroke="#1e3a5f" stroke-width="1"/>
    <text x="24" y="32" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">INPUT PIPELINE</text>
    <text x="24" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="26" font-weight="800">Dual 60FPS</text>
    <text x="175" y="68" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SYNC</text>

    <rect x="250" y="0" width="220" height="90" rx="14" fill="#040c18" stroke="#1e3a5f" stroke-width="1"/>
    <text x="274" y="32" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SAFETY SIGNALS</text>
    <text x="274" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="26" font-weight="800">5+ Fused</text>
    <text x="390" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Drowsy/Distract</text>

    <rect x="500" y="0" width="220" height="90" rx="14" fill="#040c18" stroke="#1e3a5f" stroke-width="1"/>
    <text x="524" y="32" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">VEHICLE CLASSIFIER</text>
    <text x="524" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="26" font-weight="800">4 Classes</text>
    <text x="645" y="68" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11">YOLOv8</text>

    <rect x="750" y="0" width="230" height="90" rx="14" fill="#040c18" stroke="#1e3a5f" stroke-width="1"/>
    <text x="774" y="32" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">RISK ENGINE</text>
    <text x="774" y="68" fill="#ef4444" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Low/Med/Hi/Crit</text>
  </g>

  <!-- Left Stream: In-Cabin Driver Monitoring (MediaPipe) -->
  <g transform="translate(110, 250)">
    <rect x="0" y="0" width="460" height="340" rx="16" fill="#040c18" stroke="#1e3a5f" stroke-width="1"/>
    <!-- Stream Label -->
    <rect x="16" y="16" width="160" height="28" rx="6" fill="#0c2340" stroke="#0284c7" stroke-width="1"/>
    <circle cx="30" cy="30" r="4" fill="#ef4444"/>
    <text x="42" y="34" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700">STREAM A: DRIVER CABIN</text>

    <!-- Wireframe face & eye tracking -->
    <g transform="translate(230, 160)">
      <!-- Head contour -->
      <ellipse cx="0" cy="0" rx="80" ry="105" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 3"/>
      <!-- Eyes & EAR (Eye Aspect Ratio) -->
      <ellipse cx="-32" cy="-20" rx="16" ry="8" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
      <ellipse cx="32" cy="-20" rx="16" ry="8" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
      <!-- Mesh landmark dots -->
      <circle cx="-32" cy="-20" r="3" fill="#10b981"/>
      <circle cx="32" cy="-20" r="3" fill="#10b981"/>
      <circle cx="0" cy="10" r="3" fill="#38bdf8"/>
      <circle cx="-25" cy="45" r="3" fill="#f59e0b"/>
      <circle cx="25" cy="45" r="3" fill="#f59e0b"/>
      <path d="M-25 45 Q0 55 25 45" stroke="#f59e0b" stroke-width="2" fill="none"/>

      <!-- MediaPipe bounding box -->
      <rect x="-105" y="-125" width="210" height="250" rx="8" stroke="#10b981" stroke-width="1.5" fill="none"/>
      <rect x="-105" y="-148" width="130" height="23" fill="#10b981"/>
      <text x="-95" y="-132" fill="#022c22" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Driver (Conf: 0.96)</text>
    </g>

    <!-- Overlay Telemetry -->
    <rect x="20" y="270" width="420" height="50" rx="8" fill="#081b33"/>
    <text x="35" y="292" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">EAR: <tspan fill="#10b981">0.31 (Attentive)</tspan> | Head Pitch: <tspan fill="#38bdf8">-2.4°</tspan></text>
    <text x="35" y="310" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">Yawn MAR: <tspan fill="#10b981">0.12</tspan> | Cell Phone Distraction: <tspan fill="#10b981">NONE</tspan></text>
  </g>

  <!-- Right Stream: Road Front View (YOLOv8 Detection) -->
  <g transform="translate(600, 250)">
    <rect x="0" y="0" width="490" height="340" rx="16" fill="#040c18" stroke="#1e3a5f" stroke-width="1"/>
    <!-- Stream Label -->
    <rect x="16" y="16" width="160" height="28" rx="6" fill="#0c2340" stroke="#0284c7" stroke-width="1"/>
    <circle cx="30" cy="30" r="4" fill="#10b981"/>
    <text x="42" y="34" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700">STREAM B: ROAD AHEAD</text>

    <!-- Road perspective lanes -->
    <path d="M70 300 L210 160 L280 160 L420 300" stroke="#1e3a5f" stroke-width="2" fill="#0a192f" fill-opacity="0.4"/>
    <line x1="245" y1="160" x2="245" y2="300" stroke="#facc15" stroke-dasharray="10 8" stroke-width="2"/>

    <!-- Detected Vehicle 1 (Car) -->
    <rect x="180" y="180" width="130" height="85" rx="6" stroke="#38bdf8" stroke-width="2" fill="#0369a1" fill-opacity="0.2"/>
    <rect x="180" y="160" width="115" height="20" fill="#38bdf8"/>
    <text x="186" y="174" fill="#082f49" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Car · Dist: 22m</text>

    <!-- Detected Vehicle 2 (Truck) -->
    <rect x="330" y="150" width="110" height="110" rx="6" stroke="#f59e0b" stroke-width="2" fill="#b45309" fill-opacity="0.15"/>
    <rect x="330" y="130" width="110" height="20" fill="#f59e0b"/>
    <text x="336" y="144" fill="#451a03" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Truck · Dist: 48m</text>

    <!-- Overlay Telemetry -->
    <rect x="20" y="270" width="450" height="50" rx="8" fill="#081b33"/>
    <text x="35" y="292" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">Lead Vehicle: <tspan fill="#38bdf8">22.4m</tspan> | Closing Speed: <tspan fill="#34d399">-1.2 km/h</tspan></text>
    <text x="35" y="310" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">Time-to-Collision (TTC): <tspan fill="#10b981">6.8s (SAFE)</tspan> | Frame Smoothing: <tspan fill="#38bdf8">ON</tspan></text>
  </g>

  <!-- Bottom Fused Decision Engine Strip -->
  <g transform="translate(110, 610)">
    <rect x="0" y="0" width="980" height="95" rx="14" fill="#020813" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="45" cy="47" r="22" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="45" cy="47" r="12" fill="#10b981"/>

    <text x="85" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">FUSED TELEMETRY RISK STATUS: <tspan fill="#10b981">LEVEL 1 (LOW RISK / SAFE)</tspan></text>
    <text x="85" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Signals Fused: [Gaze Focus: 98%] + [Drowsiness Index: 0.08] + [Proximity TTC: 6.8s] + [Lane Centering: OK] · Frame Jitter Filtering Active</text>

    <!-- Risk Level Pills -->
    <g transform="translate(680, 28)">
      <rect x="0" y="0" width="60" height="38" rx="6" fill="#10b981"/>
      <text x="30" y="24" fill="#022c22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">LOW</text>

      <rect x="70" y="0" width="60" height="38" rx="6" fill="#1e293b"/>
      <text x="100" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">MED</text>

      <rect x="140" y="0" width="60" height="38" rx="6" fill="#1e293b"/>
      <text x="170" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">HIGH</text>

      <rect x="210" y="0" width="68" height="38" rx="6" fill="#1e293b"/>
      <text x="244" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CRIT</text>
    </g>
  </g>
</svg>

