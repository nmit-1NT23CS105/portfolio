<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cashBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#021f17"/>
      <stop offset="50%" stop-color="#043224"/>
      <stop offset="100%" stop-color="#01120d"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" rx="24" fill="url(#cashBg)" stroke="#064e3b" stroke-width="2"/>
  
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="520" height="700" rx="18" fill="#032118" fill-opacity="0.9" stroke="#065f46" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="520" height="50" rx="18" fill="#043426"/>
    <circle cx="28" cy="25" r="5" fill="#ef4444"/>
    <circle cx="44" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="25" r="5" fill="#10b981"/>
    <text x="260" y="30" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Cashpilot · Wealth &amp; Expense Engine</text>

    <!-- Balance Card -->
    <g transform="translate(40, 75)">
      <rect x="0" y="0" width="440" height="130" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="25" y="35" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">PORTFOLIO NET BALANCE</text>
      <text x="25" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900">₹ 4,82,450.00</text>
      <text x="25" y="110" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">▲ +18.4% this month · TypeScript</text>
    </g>

    <!-- Cashflow Analytics -->
    <g transform="translate(40, 230)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="800">Budget Allocation &amp; Trends</text>
      <text x="0" y="22" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12">SQL Aggregations · Recurring Transactions</text>

      <!-- Expense Categories -->
      <g transform="translate(0, 45)">
        <rect x="0" y="0" width="440" height="55" rx="10" fill="#022c22"/>
        <text x="20" y="32" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Investments &amp; SIPs</text>
        <text x="420" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="end">45%</text>

        <rect x="0" y="65" width="440" height="55" rx="10" fill="#022c22"/>
        <text x="20" y="97" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Operating Expenses</text>
        <text x="420" y="97" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="end">28%</text>

        <rect x="0" y="130" width="440" height="55" rx="10" fill="#022c22"/>
        <text x="20" y="162" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Emergency Liquidity</text>
        <text x="420" y="162" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="end">27%</text>
      </g>

      <!-- Bottom Card -->
      <rect x="0" y="270" width="440" height="60" rx="10" fill="#011f17" stroke="#047857"/>
      <text x="20" y="297" fill="#34d399" font-family="ui-monospace, monospace" font-size="12">Security: AES-256 Encrypted Storage</text>
      <text x="20" y="317" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">TypeScript · React · Tailwind CSS · SQLite/Postgres</text>
    </g>
  </g>
</svg>

