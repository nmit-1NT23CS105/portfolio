<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cineBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c070e"/>
      <stop offset="50%" stop-color="#2a0818"/>
      <stop offset="100%" stop-color="#0a0205"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" rx="24" fill="url(#cineBg)" stroke="#3f1225" stroke-width="2"/>
  
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="520" height="700" rx="18" fill="#13040c" fill-opacity="0.9" stroke="#4c152a" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="520" height="50" rx="18" fill="#2d0b1b"/>
    <circle cx="28" cy="25" r="5" fill="#ef4444"/>
    <circle cx="44" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="25" r="5" fill="#10b981"/>
    <text x="260" y="30" fill="#f472b6" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">CineVizion Analytics Engine</text>

    <!-- Visual Movie Cards Carousel -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="130" height="180" rx="10" fill="#290d1c" stroke="#f43f5e" stroke-width="1.5"/>
      <rect x="15" y="15" width="100" height="110" rx="6" fill="#4c152a"/>
      <text x="65" y="75" fill="#fb7185" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🎬</text>
      <text x="65" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sci-Fi Recs</text>
      <text x="65" y="168" fill="#fb7185" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Cosine: 0.96</text>

      <rect x="150" y="0" width="130" height="180" rx="10" fill="#290d1c" stroke="#f43f5e" stroke-width="1.5"/>
      <rect x="165" y="15" width="100" height="110" rx="6" fill="#4c152a"/>
      <text x="215" y="75" fill="#fb7185" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🍿</text>
      <text x="215" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Box Office EDA</text>
      <text x="215" y="168" fill="#fb7185" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">ROI &gt; 4.2x</text>

      <rect x="300" y="0" width="140" height="180" rx="10" fill="#290d1c" stroke="#f43f5e" stroke-width="1.5"/>
      <rect x="315" y="15" width="110" height="110" rx="6" fill="#4c152a"/>
      <text x="370" y="75" fill="#fb7185" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">⭐</text>
      <text x="370" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sentiment NLP</text>
      <text x="370" y="168" fill="#fb7185" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">88% Positive</text>
    </g>

    <!-- Visual Graph -->
    <g transform="translate(40, 290)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="800">Content-Based Vector Space</text>
      <text x="0" y="22" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12">TF-IDF Vectorization &amp; Clustering</text>

      <!-- Distribution Bars -->
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="440" height="170" rx="12" fill="#1b0713" stroke="#3d0e24"/>
        <!-- Bar charts -->
        <rect x="40" y="90" width="30" height="60" rx="4" fill="url(#roseGrad)"/>
        <text x="55" y="165" fill="#fda4af" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Action</text>

        <rect x="100" y="50" width="30" height="100" rx="4" fill="url(#roseGrad)"/>
        <text x="115" y="165" fill="#fda4af" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Drama</text>

        <rect x="160" y="30" width="30" height="120" rx="4" fill="url(#roseGrad)"/>
        <text x="175" y="165" fill="#fda4af" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Thriller</text>

        <rect x="220" y="70" width="30" height="80" rx="4" fill="url(#roseGrad)"/>
        <text x="235" y="165" fill="#fda4af" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Sci-Fi</text>

        <rect x="280" y="100" width="30" height="50" rx="4" fill="url(#roseGrad)"/>
        <text x="295" y="165" fill="#fda4af" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Crime</text>

        <rect x="340" y="60" width="30" height="90" rx="4" fill="url(#roseGrad)"/>
        <text x="355" y="165" fill="#fda4af" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Comedy</text>
      </g>

      <rect x="0" y="245" width="440" height="60" rx="10" fill="#11030b" stroke="#360c20"/>
      <text x="20" y="272" fill="#fb7185" font-family="ui-monospace, monospace" font-size="12">Matrix: 45,000+ Titles · Latency: 14ms</text>
      <text x="20" y="292" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Python · Pandas · Scikit-learn · Matplotlib</text>
    </g>
  </g>
</svg>

