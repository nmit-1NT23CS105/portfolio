<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="kartBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1302"/>
      <stop offset="50%" stop-color="#3b2306"/>
      <stop offset="100%" stop-color="#120a01"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" rx="24" fill="url(#kartBg)" stroke="#78350f" stroke-width="2"/>
  
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="520" height="700" rx="18" fill="#1c1104" fill-opacity="0.9" stroke="#92400e" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="520" height="50" rx="18" fill="#451a03"/>
    <circle cx="28" cy="25" r="5" fill="#ef4444"/>
    <circle cx="44" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="25" r="5" fill="#10b981"/>
    <text x="260" y="30" fill="#fde68a" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">BharatKart · E-Commerce Commerce Platform</text>

    <!-- Storefront Showcase -->
    <g transform="translate(40, 75)">
      <rect x="0" y="0" width="440" height="130" rx="14" fill="#78350f" stroke="#b45309" stroke-width="1"/>
      <text x="25" y="35" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="13" font-weight="600">TRANSACTION VOLUME</text>
      <text x="25" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="900">10,000+ Orders</text>
      <text x="25" y="110" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Multi-Vendor Cart · Payment Gateway</text>
    </g>

    <!-- Product Grid Preview -->
    <g transform="translate(40, 230)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="800">Catalogue Architecture &amp; Indexing</text>
      <text x="0" y="22" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12">Full-text Search · Category Filters · Inventory Sync</text>

      <g transform="translate(0, 45)">
        <rect x="0" y="0" width="135" height="150" rx="10" fill="#291807" stroke="#b45309"/>
        <text x="67" y="65" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🛍️</text>
        <text x="67" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Artisan Crafts</text>
        <text x="67" y="125" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">₹ 1,499</text>

        <rect x="150" y="0" width="135" height="150" rx="10" fill="#291807" stroke="#b45309"/>
        <text x="217" y="65" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">📦</text>
        <text x="217" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Electronics</text>
        <text x="217" y="125" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">₹ 4,999</text>

        <rect x="300" y="0" width="140" height="150" rx="10" fill="#291807" stroke="#b45309"/>
        <text x="370" y="65" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">☕</text>
        <text x="370" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Organic Spices</text>
        <text x="370" y="125" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">₹ 399</text>
      </g>

      <rect x="0" y="240" width="440" height="60" rx="10" fill="#140b02" stroke="#78350f"/>
      <text x="20" y="267" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="12">REST API · MySQL Relational Schema</text>
      <text x="20" y="287" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">JavaScript · Node.js · Express · Redux · Tailwind</text>
    </g>
  </g>
</svg>

